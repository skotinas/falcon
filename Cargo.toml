[workspace]
resolver = "2"
members = [
    "crates/falcon-crypto",
    "crates/falcon-volume",
    "crates/falcon-fs",
    "crates/falcon-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skotinas/falcon"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hex = "0.4"
hkdf = "0.12"
indicatif = "0.17"
libc = "0.2"
ml-kem = { version = "0.2", features = ["zeroize"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serpent = { version = "0.5", features = ["zeroize"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }
xts-mode = "0.5"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
